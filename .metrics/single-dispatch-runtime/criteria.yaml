goal: "회의 그래프를 재컴파일하지 않고도 실행 중 참가자 join/leave를 처리하면서 기존 회의 흐름을 유지한다."
criteria:
  - name: "기본 회의 흐름 보존"
    description: "기존처럼 선행 참가자들이 human turn을 받고 입력 후 워크플로우가 계속 진행되어야 한다."
  - name: "실행 중 참여 반영"
    description: "워크플로우 시작 후 join한 사용자가 재시작 없이 runtime registry에 편입되고 이후 turn 대상으로 호출 가능해야 한다."
  - name: "실행 중 퇴장 복구"
    description: "human turn 대기 중 leave가 발생해도 queue wait가 풀리고 다음 이벤트가 이어져야 한다."
  - name: "런타임 dispatch 라우팅"
    description: "라우팅이 컴파일 시점 고정 노드명이 아니라 runtime participant registry를 기준으로 동작해야 한다."
  - name: "엔진/서버 동기화"
    description: "human turn 감지, room registry, queue 관리가 같은 runtime participant 집합을 기준으로 동작해야 한다."
