agents:
  - name: Host
    role: host
    responsibilities:
      - 회의 진행 및 의사결정 정리
    expertise:
      - 퍼실리테이션
      - 안건 관리
    phase_triggers: {}

  - name: PM
    role: project_manager
    responsibilities:
      - 일정/리스크 관리
    expertise:
      - 프로젝트 관리
    phase_triggers: {}

  - name: TechLead
    role: tech_lead
    responsibilities:
      - 기술 의사결정
      - 아키텍처 리뷰
    expertise:
      - 시스템 설계
      - 코드 품질
    phase_triggers: {}
    agents:
      - name: Backend
        role: backend_engineer
        responsibilities:
          - API 설계 및 서버 구현
        expertise:
          - Python
          - FastAPI
        phase_triggers: {}
      - name: Frontend
        role: frontend_engineer
        responsibilities:
          - UI 구현 및 개선
        expertise:
          - React
          - TypeScript
        phase_triggers: {}
