dimensions:
  - name: readability
    description: "핵심 흐름을 파일 구조와 메서드만으로 따라가기 쉬운가"
    scale:
      1: "흐름이 뒤엉켜 있어 의도 파악이 어렵다"
      3: "주요 흐름은 따라갈 수 있지만 큰 메서드나 숨은 전제가 남아 있다"
      5: "흐름, 책임, 전제가 명확하고 읽는 비용이 낮다"
  - name: separation_of_concerns
    description: "동적 참가자 관리 책임이 적절한 계층으로 분리되어 있는가"
    scale:
      1: "단일 모듈에 책임이 과도하게 섞여 있다"
      3: "주요 책임은 분리됐지만 결합점이 여전히 크다"
      5: "상태, 라우팅, 엔진, 서버 책임이 명확히 나뉜다"
  - name: error_handling
    description: "퇴장, 누락 참가자, 호환 경로 등 실패 케이스를 안전하게 처리하는가"
    scale:
      1: "실패 시 hang 또는 예외 전파 가능성이 높다"
      3: "주요 실패 케이스는 다루지만 빈틈이 남아 있다"
      5: "실패 케이스를 명시적으로 흡수하고 복구 경로가 있다"
  - name: naming_clarity
    description: "dispatch, participant_registry, human_turn 등 도메인 이름이 역할을 잘 드러내는가"
    scale:
      1: "핵심 이름이 모호하거나 중복 의미를 가진다"
      3: "대체로 명확하지만 일부 이름은 맥락이 필요하다"
      5: "핵심 개념이 이름만으로 충분히 설명된다"
  - name: testability
    description: "단위/통합/실행 실험으로 동작을 재현하고 검증하기 쉬운가"
    scale:
      1: "행동을 고립해 검증하기 어렵다"
      3: "핵심 경로는 검증되지만 런타임 시나리오 커버가 제한적이다"
      5: "단위, 통합, 실행 실험까지 재현 가능하게 설계됐다"
