  - name: DevOps
    role: devops_engineer
    responsibilities:
      - CI/CD 파이프라인 구축
      - 인프라 관리
      - 모니터링 시스템
    expertise:
      - Kubernetes
      - Docker
      - Terraform
    phase_triggers: {}

  - name: Designer
    role: designer
    responsibilities:
      - UI/UX 설계
      - 사용자 경험 개선
    expertise:
      - 인터페이스 디자인
      - 사용성 테스트
    phase_triggers: {}
