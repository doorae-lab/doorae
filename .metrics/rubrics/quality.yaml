# Implementation Quality Rubric (축 2: 구현 품질)
# 프로젝트 공통 rubric - 모든 평가에서 재사용
# 각 차원 1-5점, 홀수 점수에 구체적 기준 명시 (2, 4는 인접 점수의 중간)

readability:
  name: "가독성"
  description: "코드를 처음 보는 개발자가 의도를 얼마나 빨리 파악할 수 있는가"
  scores:
    1: "함수가 50줄 이상이거나 중첩 3단계 이상. 매직넘버, 불명확한 변수명 다수. 의도 파악에 5분 이상 소요"
    3: "함수 구조와 흐름은 파악 가능하나, 일부 로직의 의도가 불명확. 주석 없이는 이해하기 어려운 부분 존재"
    5: "함수명과 구조만으로 의도가 즉시 파악됨. 자기 문서화된 코드. 주석이 불필요할 정도로 명확"

separation_of_concerns:
  name: "관심사 분리"
  description: "각 모듈/클래스/함수가 단일 책임을 가지는가"
  scores:
    1: "하나의 함수/클래스가 3가지 이상의 책임을 가짐. 비즈니스 로직, I/O, 에러 처리가 혼재"
    3: "대체로 분리되어 있으나 일부 함수에서 2가지 이상의 책임이 혼재. 리팩터링 여지 존재"
    5: "각 단위가 명확히 단일 책임을 가짐. 변경 이유가 하나뿐. 의존성 방향이 명확"

error_handling:
  name: "에러 처리"
  description: "예외 상황과 엣지 케이스를 적절히 다루는가"
  scores:
    1: "예외 무시, bare except, 또는 에러 처리 부재. 실패 시 무의미한 에러 메시지"
    3: "주요 경로의 에러는 처리하나, 엣지 케이스 일부 누락. 에러 메시지가 디버깅에 부분적으로 유용"
    5: "모든 실패 경로에 적절한 처리와 복구/폴백. 에러 메시지가 원인과 해결 방향을 제시"

naming_clarity:
  name: "네이밍 명확성"
  description: "변수명, 함수명, 클래스명이 의도를 정확히 전달하는가"
  scores:
    1: "단일 문자 변수, 모호한 약어, 이름과 실제 동작 불일치. 이름만으로 역할 추론 불가"
    3: "대체로 의미 있는 이름이나, 일부 모호하거나 프로젝트 관례와 불일치"
    5: "모든 이름이 역할과 의도를 즉시 전달. 프로젝트 관례 일관. 도메인 용어 정확히 반영"

testability:
  name: "테스트 용이성"
  description: "코드가 테스트하기 쉽게 구조화되어 있는가"
  scores:
    1: "전역 상태 의존, 하드코딩된 외부 의존성, 부수효과가 많아 단위 테스트 불가능에 가까움"
    3: "일부 의존성 주입 가능하나, 모킹이 어려운 부분 존재. 테스트 작성 시 우회 필요"
    5: "의존성 주입 완비, 순수 함수 중심, 부수효과 격리. 테스트 픽스처 설정이 간단"
