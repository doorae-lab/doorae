[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thetable"
version = "0.1.0"
description = "AI-powered team meeting system with supervisor architecture"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-supervisor>=0.0.1",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.21.1",
    "loguru>=0.7.3",
    "rich>=14.3.1",
]

[project.scripts]
thetable = "thetable.interfaces.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
