<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doorae - 채팅 서버</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* 닉네임 입력 화면 */
        .login-screen {
            padding: 60px 40px;
            text-align: center;
        }

        .login-screen h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .login-screen p {
            color: #666;
            margin-bottom: 40px;
        }

        .login-screen input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .login-screen input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-screen button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-screen button:hover {
            background: #5568d3;
        }

        /* 채팅 화면 */
        .chat-screen {
            display: none;
            height: 600px;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #667eea;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.5em;
        }

        .chat-header .username {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .agenda-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            background: #eef2ff;
            border-bottom: 1px solid #d6dcff;
            color: #344054;
            font-size: 0.95em;
        }

        .agenda-title {
            font-weight: 600;
        }

        .agenda-meta {
            color: #667085;
            white-space: nowrap;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.system {
            background: #e3f2fd;
            color: #1976d2;
            margin: 10px auto;
            text-align: center;
            max-width: 80%;
            font-size: 0.9em;
        }

        .message.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.received {
            background: white;
            color: #333;
        }

        .message.ai {
            border-left: 4px solid #667eea;
        }

        .message.streaming .content::after {
            content: '▍';
            margin-left: 2px;
            color: #667eea;
            animation: blink 1s steps(1) infinite;
        }

        .message.meeting-ended {
            background: #fff4e5;
            color: #b54708;
        }

        .message .sender {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .message .badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 0.72em;
            font-weight: 600;
        }

        .message .content {
            line-height: 1.4;
        }

        .message .content .mention {
            display: inline-block;
            margin: 0 1px;
            padding: 1px 6px;
            border-radius: 6px;
            background: #eef2ff;
            color: #4f46e5;
            font-weight: 600;
        }

        .message .time {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled,
        .input-area input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 닉네임 입력 화면 -->
        <div class="login-screen" id="loginScreen">
            <h1>Doorae</h1>
            <p>닉네임을 입력하고 채팅에 참여하세요</p>
            <input
                type="text"
                id="usernameInput"
                placeholder="닉네임 입력..."
                maxlength="20"
            />
            <button onclick="joinChat()">참여하기</button>
        </div>

        <!-- 채팅 화면 -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <h2>채팅방</h2>
                <div class="username" id="currentUsername"></div>
            </div>
            <div class="agenda-bar" id="agendaBar">
                <span class="agenda-title" id="currentAgenda">안건 대기 중...</span>
                <span class="agenda-meta" id="agendaMeta">회의 준비 중</span>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="메시지 입력..."
                    onkeypress="handleKeyPress(event)"
                />
                <button id="sendButton" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let username = '';
        let roomId = 'default-room'; // TODO: 회의방 선택 기능
        let currentSpeaker = null;
        let currentMessageEl = null;
        let currentAgendaIdx = -1;
        let agendas = [];
        let meetingEnded = false;

        // 채팅 참여
        async function joinChat() {
            const input = document.getElementById('usernameInput');
            username = input.value.trim();

            if (!username) {
                alert('닉네임을 입력해주세요');
                return;
            }

            // 회의방 생성 또는 조회
            try {
                const response = await fetch('/api/rooms');
                const rooms = await response.json();

                if (rooms.length === 0) {
                    // 회의방이 없으면 생성
                    const createResponse = await fetch('/api/rooms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: '기본 회의방',
                            agenda: null
                        })
                    });
                    const newRoom = await createResponse.json();
                    roomId = newRoom.id;
                } else {
                    // 첫 번째 회의방 사용
                    roomId = rooms[0].id;
                }

                // WebSocket 연결
                connectWebSocket();

                // 화면 전환
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatScreen').style.display = 'flex';
                document.getElementById('currentUsername').textContent = username;

            } catch (error) {
                alert('서버 연결 실패: ' + error.message);
            }
        }

        // WebSocket 연결
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${roomId}?username=${encodeURIComponent(username)}&raw_events=false`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket 연결됨');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onerror = (error) => {
                console.error('WebSocket 에러:', error);
                addSystemMessage('연결 오류가 발생했습니다');
            };

            ws.onclose = () => {
                console.log('WebSocket 연결 종료');
                addSystemMessage('연결이 종료되었습니다');
            };
        }

        // 메시지 처리
        function handleMessage(data) {
            if (!data || typeof data.type !== 'string') {
                return;
            }

            if (data.type.startsWith('semantic:')) {
                handleSemanticEvent(data.type.slice('semantic:'.length), data.data || {});
                return;
            }

            if (data.type === 'system') {
                addSystemMessage(data.data.message);
            } else if (data.type === 'message') {
                addChatMessage(
                    data.data.sender,
                    data.data.content,
                    data.data.sender === username
                );
            } else if (data.type === 'error') {
                addSystemMessage('오류: ' + data.data.error);
            }
        }

        function handleSemanticEvent(eventType, eventData) {
            switch (eventType) {
                case 'state_snapshot':
                    handleStateSnapshot(eventData);
                    break;
                case 'speaker_changed':
                    handleSpeakerChanged(eventData);
                    break;
                case 'token':
                    handleToken(eventData);
                    break;
                case 'turn_completed':
                    handleTurnCompleted();
                    break;
                case 'human_turn_started':
                    handleHumanTurnStarted(eventData);
                    break;
                case 'agenda_updated':
                    handleAgendaUpdated(eventData);
                    break;
                case 'meeting_ended':
                    handleMeetingEnded(eventData);
                    break;
                case 'agent_profiles':
                case 'pending_speakers_changed':
                case 'participant_status_changed':
                case 'tool_call':
                case 'participants_list':
                case 'user_joined':
                    break;
                default:
                    console.debug('무시된 semantic 이벤트:', eventType, eventData);
            }
        }

        function handleStateSnapshot(data) {
            if (!data || typeof data !== 'object') {
                return;
            }

            if (Array.isArray(data.agendas) && typeof data.current_agenda_idx === 'number') {
                agendas = data.agendas;
                currentAgendaIdx = data.current_agenda_idx;
                renderAgendaBar();
            }

            const participantStatuses = data.participant_statuses;
            if (participantStatuses && typeof participantStatuses === 'object') {
                const waitingUser = Object.entries(participantStatuses).find(([, status]) => status === 'waiting_input');
                if (waitingUser) {
                    setInputEnabled(waitingUser[0] === username);
                }
            }

            const delegatedSpeaker = typeof data.current_delegated_speaker === 'string'
                ? data.current_delegated_speaker
                : '';
            const activeSpeaker = delegatedSpeaker || data.current_speaker;
            if (typeof activeSpeaker === 'string' && activeSpeaker) {
                handleSpeakerChanged({
                    speaker: activeSpeaker,
                    is_delegated: Boolean(delegatedSpeaker)
                });
            }
        }

        function handleSpeakerChanged(data) {
            if (!data || typeof data.speaker !== 'string' || !data.speaker) {
                return;
            }

            finalizeCurrentStream();
            currentSpeaker = data.speaker;
            currentMessageEl = createMessageElement(data.speaker, '', false, {
                isAi: true,
                streaming: true,
                badge: data.is_delegated ? '위임' : 'AI'
            });
            appendMessageElement(currentMessageEl);
        }

        function handleToken(data) {
            if (!data || typeof data.content !== 'string' || !data.content) {
                return;
            }

            if (!currentMessageEl) {
                handleSpeakerChanged({
                    speaker: data.speaker || 'AI',
                    is_delegated: Boolean(data.is_delegated)
                });
            }

            const contentEl = currentMessageEl.querySelector('.content');
            if (contentEl) {
                const previous = contentEl.dataset.rawContent || '';
                const next = previous + data.content;
                contentEl.dataset.rawContent = next;
                contentEl.innerHTML = highlightMentions(next);
            }
            scrollMessagesToBottom();
        }

        function handleTurnCompleted() {
            finalizeCurrentStream();
            currentSpeaker = null;
        }

        function handleHumanTurnStarted(data) {
            if (!data || typeof data.username !== 'string' || !data.username) {
                return;
            }

            if (data.username === username) {
                addSystemMessage('지금은 당신의 발언 차례입니다.');
                setInputEnabled(true);
                document.getElementById('messageInput').focus();
                return;
            }

            addSystemMessage(`${data.username}님의 발언 차례입니다.`);
            setInputEnabled(false);
        }

        function handleAgendaUpdated(data) {
            if (!data || !Array.isArray(data.agendas) || typeof data.current_idx !== 'number') {
                return;
            }

            agendas = data.agendas;
            currentAgendaIdx = data.current_idx;
            renderAgendaBar();
        }

        function handleMeetingEnded(data) {
            if (data && Array.isArray(data.agendas)) {
                agendas = data.agendas;
            }
            finalizeCurrentStream();
            meetingEnded = true;
            renderAgendaBar();
            addSystemMessage('회의가 종료되었습니다.', 'meeting-ended');
            document.getElementById('chatScreen').classList.add('meeting-ended');
            setInputEnabled(false);
        }

        // 메시지 전송
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !ws || meetingEnded) return;

            ws.send(JSON.stringify({ content }));
            input.value = '';
        }

        // Enter 키 처리
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 채팅 메시지 추가
        function addChatMessage(sender, content, isSent) {
            appendMessageElement(createMessageElement(sender, content, isSent));
        }

        // 시스템 메시지 추가
        function addSystemMessage(message, extraClass = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message system ${extraClass}`.trim();
            messageDiv.textContent = message;
            appendMessageElement(messageDiv);
        }

        function createMessageElement(sender, content, isSent, options = {}) {
            const messageDiv = document.createElement('div');
            const classes = ['message', isSent ? 'sent' : 'received'];

            if (options.isAi) {
                classes.push('ai');
            }

            if (options.streaming) {
                classes.push('streaming');
            }

            messageDiv.className = classes.join(' ');

            const time = new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });

            if (!isSent) {
                const senderDiv = document.createElement('div');
                senderDiv.className = 'sender';
                senderDiv.textContent = sender || 'AI';

                if (options.badge) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = options.badge;
                    senderDiv.appendChild(badge);
                }

                messageDiv.appendChild(senderDiv);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.dataset.rawContent = content;
            contentDiv.innerHTML = highlightMentions(content);
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'time';
            timeDiv.textContent = time;
            messageDiv.appendChild(timeDiv);

            return messageDiv;
        }

        function appendMessageElement(messageDiv) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(messageDiv);
            scrollMessagesToBottom();
        }

        function scrollMessagesToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function finalizeCurrentStream() {
            if (!currentMessageEl) {
                currentSpeaker = null;
                return;
            }

            currentMessageEl.classList.remove('streaming');
            currentMessageEl = null;
            currentSpeaker = null;
        }

        function renderAgendaBar() {
            const titleEl = document.getElementById('currentAgenda');
            const metaEl = document.getElementById('agendaMeta');

            if (!Array.isArray(agendas) || currentAgendaIdx < 0 || !agendas[currentAgendaIdx]) {
                titleEl.textContent = meetingEnded ? '회의 종료' : '안건 대기 중...';
                metaEl.textContent = meetingEnded ? '모든 토론이 종료되었습니다' : '회의 준비 중';
                return;
            }

            const currentAgenda = agendas[currentAgendaIdx];
            const title = currentAgenda.title || `안건 ${currentAgendaIdx + 1}`;
            const status = currentAgenda.status || 'pending';
            titleEl.textContent = `${currentAgendaIdx + 1}. ${title}`;
            metaEl.textContent = meetingEnded
                ? '회의 종료'
                : `상태: ${status}`;
        }

        function setInputEnabled(enabled) {
            const input = document.getElementById('messageInput');
            const button = document.getElementById('sendButton');
            input.disabled = !enabled;
            button.disabled = !enabled;
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightMentions(text) {
            const escaped = escapeHtml(text);
            const mentionPattern = /(^|[^0-9A-Za-z_가-힣@.])(@[0-9A-Za-z_가-힣]+)/g;
            return escaped.replace(
                mentionPattern,
                (match, prefix, mention) => `${prefix}<span class="mention">${mention}</span>`
            );
        }

        // Enter 키로 채팅 참여
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinChat();
        });
    </script>
</body>
</html>
