agents:
  - name: Host
    role: host
    responsibilities:
      - 회의 시작 인사 및 안건 소개
      - Phase 전환 안내 및 조율
      - 토론 중재 및 의견 요청
      - 회의 요약 및 마무리
    expertise:
      - 회의 퍼실리테이션
      - 시간 관리
      - 갈등 조정
    phase_triggers: {}

  - name: PM
    role: project_manager
    responsibilities:
      - 프로젝트 일정 관리
      - 진행 상황 보고
      - 리스크 식별
    expertise:
      - 일정 계획
      - 자원 관리
    phase_triggers:
      status_check: "프로젝트 현황을 보고하세요"

  - name: TechLead
    role: tech_lead
    responsibilities:
      - 기술 의사결정
      - 아키텍처 설계
      - 코드 리뷰
    expertise:
      - 시스템 설계
      - 성능 최적화
    phase_triggers:
      issue_resolution: "기술적 해결 방안을 제시하세요"
