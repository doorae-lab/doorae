[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doorae"
version = "0.1.0"
description = "AI-powered team meeting system with LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.21.1",
    "loguru>=0.7.3",
    "rich>=14.3.1",
    "langsmith>=0.6.6",
    "prompt-toolkit>=3.0.52",
    "textual>=8.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "langmem>=0.0.20",
]

[project.scripts]
doorae = "doorae.interfaces.cli:app"
# Deprecated compatibility shim. Prefer `doorae serve`.
doorae-server = "doorae.server:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "langsmith>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
